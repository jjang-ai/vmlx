name: Publish exact release candidate
run-name: Publish v${{ inputs.version }} from candidate run ${{ inputs.candidate_run_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful candidate run ID (not used for exact public-asset recovery)
        required: false
      version:
        description: Exact version, without the v prefix
        required: true
      source_sha:
        description: Exact 40-character vMLX candidate SHA
        required: true
      jang_sha:
        description: Exact 40-character JANGQ candidate SHA
        required: true
      publish_jangq:
        description: Dispatch JANGQ's own tagged PyPI publisher and wait for it
        required: true
        type: boolean
        default: false
      jangq_tag:
        description: Existing JANGQ tag, required when publish_jangq is true
        required: false
      deploy_website:
        description: Update mlx.studio and verify both public domains
        required: true
        type: boolean
        default: true
      confirm:
        description: Type PUBLISH vX.Y.Z EXACT CANDIDATE
        required: true
      pypi_recovery:
        description: Publish only the already-released, digest-verified Python artifacts through Trusted Publishing
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: vmlx-production-publication
  cancel-in-progress: false

jobs:
  preflight-production:
    name: Preflight cross-repository publication credentials
    runs-on: ubuntu-latest
    environment: production-release
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Select configured release credential
        id: auth
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_APP_ID" && -n "$RELEASE_APP_PRIVATE_KEY" ]]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [[ -n "$RELEASE_PAT" ]]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "Configure the release GitHub App or protected RELEASE_PAT before publication." >&2
            exit 1
          fi

      - name: Mint preflight release-app credential
        if: ${{ steps.auth.outputs.mode == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: jjang-ai
          repositories: |
            vmlx
            mlxstudio
            jangq

      - name: Prove required repository permissions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          for repo in vmlx mlxstudio jangq; do
            test "$(gh api "repos/jjang-ai/${repo}" --jq '.permissions.push')" = true
          done
          test "$(gh api repos/jjang-ai/jangq/actions/permissions --jq .enabled)" = true

  preflight-pypi:
    name: Preflight PyPI Trusted Publisher configuration
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Require reviewed Trusted Publisher registration
        env:
          TRUSTED_PUBLISHER_CONFIGURED: ${{ vars.TRUSTED_PUBLISHER_CONFIGURED }}
        run: |
          set -euo pipefail
          test "$TRUSTED_PUBLISHER_CONFIGURED" = true || {
            echo "Register jjang-ai/vmlx publish-release.yml, environment pypi, as a PyPI Trusted Publisher." >&2
            exit 1
          }

  preflight-website:
    name: Preflight website deployment credentials
    runs-on: ubuntu-latest
    environment: website-release
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Prove website origin access before publication
        if: ${{ inputs.deploy_website }}
        env:
          WEBSITE_SSH_PRIVATE_KEY: ${{ secrets.WEBSITE_SSH_PRIVATE_KEY }}
          WEBSITE_SSH_HOST_KEY: ${{ vars.WEBSITE_SSH_HOST_KEY }}
          WEBSITE_SSH_HOST: ${{ vars.WEBSITE_SSH_HOST }}
          WEBSITE_SSH_USER: ${{ vars.WEBSITE_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$WEBSITE_SSH_PRIVATE_KEY"
          test -n "$WEBSITE_SSH_HOST_KEY"
          [[ "$WEBSITE_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$WEBSITE_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$WEBSITE_SSH_PRIVATE_KEY" > "$HOME/.ssh/release_key"
          printf '%s\n' "$WEBSITE_SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/release_key" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/release_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${WEBSITE_SSH_USER}@${WEBSITE_SSH_HOST}" \
            'test -w /var/www/mlx.studio/update && test -w /var/www/mlx.studio/download && test -w /var/backups/vmlx-releases'

      - name: Validate optional Cloudflare configuration
        if: ${{ inputs.deploy_website }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MLX_STUDIO_ZONE_ID: ${{ vars.CLOUDFLARE_MLX_STUDIO_ZONE_ID }}
          VMLX_NET_ZONE_ID: ${{ vars.CLOUDFLARE_VMLX_NET_ZONE_ID }}
        run: |
          set -euo pipefail
          values=0
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] && values=$((values + 1))
          [[ -n "$MLX_STUDIO_ZONE_ID" ]] && values=$((values + 1))
          [[ -n "$VMLX_NET_ZONE_ID" ]] && values=$((values + 1))
          if [[ "$values" -ne 0 && "$values" -ne 3 ]]; then
            echo "Configure all Cloudflare values or leave all three unset." >&2
            exit 1
          fi
          echo "cloudflare_configured=$([[ "$values" -eq 3 ]] && echo true || echo false)"

  validate:
    name: Validate immutable candidate and public heads
    if: ${{ !inputs.pypi_recovery }}
    needs: [preflight-production, preflight-pypi, preflight-website]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      jang_version: ${{ steps.metadata.outputs.jang_version }}

    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a candidate run for normal promotion
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]

      - name: Download exact candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vmlx-release-candidate-${{ inputs.source_sha }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Validate confirmation, metadata, and public branches
        id: metadata
        env:
          VERSION_INPUT: ${{ inputs.version }}
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
          JANG_SHA_INPUT: ${{ inputs.jang_sha }}
          CONFIRM_INPUT: ${{ inputs.confirm }}
          PUBLISH_JANGQ: ${{ inputs.publish_jangq }}
          JANGQ_TAG: ${{ inputs.jangq_tag }}
        run: |
          set -euo pipefail
          [[ "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$JANG_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRM_INPUT" = "PUBLISH v${VERSION_INPUT} EXACT CANDIDATE"
          source_main="$(git ls-remote https://github.com/jjang-ai/vmlx.git refs/heads/main | awk '{print $1}')"
          jang_main="$(git ls-remote https://github.com/jjang-ai/jangq.git refs/heads/main | awk '{print $1}')"
          test "$source_main" = "$SOURCE_SHA_INPUT"
          test "$jang_main" = "$JANG_SHA_INPUT"
          .github/scripts/release_metadata.py verify \
            --metadata candidate/release-info.json \
            --dist candidate/dmgs \
            --python-dist candidate/python-dist \
            --version "$VERSION_INPUT" \
            --source-sha "$SOURCE_SHA_INPUT" \
            --jang-sha "$JANG_SHA_INPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          metadata = json.load(open('candidate/release-info.json'))
          print(f"jang_version={metadata['jangq']['version']}")
          PY
          if [[ "$PUBLISH_JANGQ" == "true" ]]; then
            expected_jang_tag="v$(python -c 'import json; print(json.load(open("candidate/release-info.json"))["jangq"]["version"])')"
            test "$JANGQ_TAG" = "$expected_jang_tag"
            tag_sha="$(git ls-remote https://github.com/jjang-ai/jangq.git "refs/tags/${JANGQ_TAG}^{}" | awk '{print $1}')"
            if [[ -z "$tag_sha" ]]; then
              tag_sha="$(git ls-remote https://github.com/jjang-ai/jangq.git "refs/tags/${JANGQ_TAG}" | awk '{print $1}')"
            fi
            test "$tag_sha" = "$JANG_SHA_INPUT"
          fi

      - name: Reject already-public release state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo jjang-ai/vmlx >/dev/null 2>&1; then
            echo "vMLX release already exists: $TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code https://github.com/jjang-ai/vmlx.git "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "vMLX tag already exists: $TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code https://github.com/jjang-ai/mlxstudio.git "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "MLX Studio tag already exists: $TAG" >&2
            exit 1
          fi

  publish-github:
    name: Publish both GitHub repositories
    needs: validate
    runs-on: ubuntu-latest
    environment: production-release
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write

    steps:
      - name: Select release credential
        id: auth
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_APP_ID" && -n "$RELEASE_APP_PRIVATE_KEY" ]]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [[ -n "$RELEASE_PAT" ]]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: Create narrowly scoped release-app token
        if: ${{ steps.auth.outputs.mode == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: jjang-ai
          repositories: |
            vmlx
            mlxstudio

      - name: Download exact candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vmlx-release-candidate-${{ inputs.source_sha }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Stage and publish identical releases
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT }}
          TAG: v${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test ! "$(gh release view "$TAG" -R jjang-ai/vmlx 2>/dev/null || true)"
          test ! "$(gh release view "$TAG" -R jjang-ai/mlxstudio 2>/dev/null || true)"
          gh release create "$TAG" \
            --repo jjang-ai/vmlx \
            --target "$SOURCE_SHA" \
            --title "vMLX ${{ inputs.version }}" \
            --notes-file candidate/release-notes.md \
            --draft \
            candidate/dmgs/* \
            candidate/python-dist/* \
            candidate/release-info.json
          gh release create "$TAG" \
            --repo jjang-ai/mlxstudio \
            --title "vMLX ${{ inputs.version }}" \
            --notes-file candidate/release-notes.md \
            --draft \
            candidate/dmgs/* \
            candidate/release-info.json
          gh release edit "$TAG" --repo jjang-ai/mlxstudio --draft=false
          gh release edit "$TAG" --repo jjang-ai/vmlx --draft=false

  publish-pypi:
    name: Publish vmlx to PyPI with Trusted Publishing
    needs: [validate, publish-github]
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Check out immutable release helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Download exact candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vmlx-release-candidate-${{ inputs.source_sha }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Check immutable PyPI version state
        id: pypi-state
        run: |
          .github/scripts/release_metadata.py check-pypi \
            --metadata candidate/release-info.json \
            --version "${{ inputs.version }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish without a stored PyPI token
        if: ${{ steps.pypi-state.outputs.publish_required == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: candidate/python-dist/
          verbose: true

  recover-pypi:
    name: Recover PyPI publication from exact GitHub release assets
    if: ${{ inputs.pypi_recovery }}
    needs: [preflight-production, preflight-pypi, preflight-website]
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify the already-public Python artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
          JANG_SHA_INPUT: ${{ inputs.jang_sha }}
          CONFIRM_INPUT: ${{ inputs.confirm }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$CONFIRM_INPUT" = "PUBLISH v${VERSION_INPUT} EXACT CANDIDATE"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA_INPUT"
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA_INPUT"
          test "$(gh release view "$TAG" --repo jjang-ai/vmlx --json isDraft --jq .isDraft)" = false
          mkdir -p candidate/python-dist
          gh release download "$TAG" --repo jjang-ai/vmlx \
            --pattern release-info.json \
            --pattern 'vmlx-*.whl' \
            --pattern 'vmlx-*.tar.gz' \
            --dir candidate
          mv candidate/vmlx-*.whl candidate/vmlx-*.tar.gz candidate/python-dist/
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("candidate/release-info.json").read_text())
          assert metadata["version"] == os.environ["VERSION_INPUT"]
          assert metadata["source"]["commit"] == os.environ["SOURCE_SHA_INPUT"]
          assert metadata["jangq"]["commit"] == os.environ["JANG_SHA_INPUT"]
          for artifact in metadata["python_distributions"].values():
              path = Path("candidate/python-dist") / artifact["filename"]
              assert path.is_file(), path
              assert path.stat().st_size == artifact["bytes"], path
              assert hashlib.sha256(path.read_bytes()).hexdigest() == artifact["sha256"], path
          PY

      - name: Check immutable PyPI version state
        id: pypi-state
        run: |
          .github/scripts/release_metadata.py check-pypi \
            --metadata candidate/release-info.json \
            --version "${{ inputs.version }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish exact release assets without a stored PyPI token
        if: ${{ steps.pypi-state.outputs.publish_required == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: candidate/python-dist/
          verbose: true

  update-manifests:
    name: Update byte-identical updater manifests
    needs: [validate, publish-github, publish-pypi, recover-pypi]
    if: >-
      ${{ always() &&
          ((!inputs.pypi_recovery && needs.publish-pypi.result == 'success') ||
           (inputs.pypi_recovery && needs.recover-pypi.result == 'success')) }}
    runs-on: ubuntu-latest
    environment: production-release
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write

    steps:
      - name: Select release credential
        id: auth
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_APP_ID" && -n "$RELEASE_APP_PRIVATE_KEY" ]]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [[ -n "$RELEASE_PAT" ]]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: Create narrowly scoped release-app token
        if: ${{ steps.auth.outputs.mode == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: jjang-ai
          repositories: |
            vmlx
            mlxstudio

      - name: Check out both public repositories
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jjang-ai/vmlx
          ref: main
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT }}
          path: repo-vmlx
          fetch-depth: 0

      - name: Check out MLX Studio release repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jjang-ai/mlxstudio
          ref: main
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT }}
          path: repo-mlxstudio
          fetch-depth: 0

      - name: Download exact candidate artifact
        if: ${{ !inputs.pypi_recovery }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vmlx-release-candidate-${{ inputs.source_sha }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Recover verified public updater inputs
        if: ${{ inputs.pypi_recovery }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          JANG_SHA: ${{ inputs.jang_sha }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh release download "v$VERSION" --repo jjang-ai/vmlx \
            --pattern release-info.json --dir candidate
          gh api "repos/jjang-ai/vmlx/releases/tags/v$VERSION" > candidate/github-release.json
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          raw = Path("candidate/release-info.json").read_bytes()
          metadata = json.loads(raw)
          release = json.loads(Path("candidate/github-release.json").read_text())
          assert metadata["version"] == os.environ["VERSION"]
          assert metadata["source"]["commit"] == os.environ["SOURCE_SHA"]
          assert metadata["jangq"]["commit"] == os.environ["JANG_SHA"]
          assert release["tag_name"] == "v" + os.environ["VERSION"]
          assert release["draft"] is False
          assert release["prerelease"] is False
          assert set(metadata["artifacts"]) == {"sequoia", "tahoe"}
          expected = {"release-info.json": (len(raw), hashlib.sha256(raw).hexdigest())}
          for row in metadata["artifacts"].values():
              expected[row["filename"]] = (row["bytes"], row["sha256"])
              expected[row["blockmap_filename"]] = (row["blockmap_bytes"], row["blockmap_sha256"])
          for row in metadata["python_distributions"].values():
              expected[row["filename"]] = (row["bytes"], row["sha256"])
          assets = {row["name"]: row for row in release["assets"]}
          assert len(assets) == len(release["assets"]) and set(assets) == set(expected)
          for name, (size, digest) in expected.items():
              asset = assets[name]
              assert asset["size"] == size and asset["digest"] == "sha256:" + digest
          notes = release["body"]
          assert notes.startswith("# vMLX " + os.environ["VERSION"] + "\n")
          Path("candidate/release-notes.md").write_text(notes)
          PY

      - name: Generate and push the same Tahoe-first manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          repo-vmlx/.github/scripts/release_metadata.py write-updater \
            --metadata candidate/release-info.json \
            --notes candidate/release-notes.md \
            --output "$RUNNER_TEMP/latest.json"
          cp "$RUNNER_TEMP/latest.json" repo-vmlx/latest.json
          cp "$RUNNER_TEMP/latest.json" repo-mlxstudio/latest.json
          cmp repo-vmlx/latest.json repo-mlxstudio/latest.json
          for repo in repo-vmlx repo-mlxstudio; do
            git -C "$repo" config user.name "Jinho Jang"
            git -C "$repo" config user.email "eric@jangq.ai"
            if ! git -C "$repo" diff --quiet -- latest.json; then
              printf 'Publish vMLX %s updater manifest\n' "$VERSION" > "$RUNNER_TEMP/manifest-commit.txt"
              git -C "$repo" add latest.json
              git -C "$repo" commit -F "$RUNNER_TEMP/manifest-commit.txt"
              git -C "$repo" push origin HEAD:main
            fi
          done
          cp "$RUNNER_TEMP/latest.json" published-latest.json

      - name: Upload the canonical public manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vmlx-public-manifest-${{ inputs.version }}
          path: published-latest.json
          if-no-files-found: error
          retention-days: 90

  publish-jangq:
    name: Dispatch JANGQ's exact tagged publisher
    if: ${{ inputs.publish_jangq && !inputs.pypi_recovery }}
    needs: [validate, update-manifests]
    runs-on: ubuntu-latest
    environment: production-release
    timeout-minutes: 30

    steps:
      - name: Select release credential
        id: auth
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_APP_ID" && -n "$RELEASE_APP_PRIVATE_KEY" ]]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [[ -n "$RELEASE_PAT" ]]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: Create narrowly scoped release-app token
        if: ${{ steps.auth.outputs.mode == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: jjang-ai
          repositories: jangq

      - name: Dispatch and wait for JANGQ Trusted Publishing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PAT }}
          JANGQ_TAG: ${{ inputs.jangq_tag }}
        run: |
          set -euo pipefail
          before="$(gh run list -R jjang-ai/jangq --workflow publish-pypi.yml --limit 30 --json databaseId --jq '.[].databaseId')"
          gh workflow run publish-pypi.yml -R jjang-ai/jangq --ref main -f ref="$JANGQ_TAG"
          run_id=""
          for _ in $(seq 1 30); do
            candidate="$(gh run list -R jjang-ai/jangq --workflow publish-pypi.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "$candidate" ]] && ! grep -qx "$candidate" <<< "$before"; then
              run_id="$candidate"
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" -R jjang-ai/jangq --exit-status

  deploy-website:
    name: Deploy and verify website updater surfaces
    if: ${{ always() && inputs.deploy_website && needs.update-manifests.result == 'success' }}
    needs: [validate, update-manifests]
    runs-on: ubuntu-latest
    environment: website-release
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out release helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Download canonical public manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vmlx-public-manifest-${{ inputs.version }}
          path: website

      - name: Install ephemeral website SSH identity
        env:
          WEBSITE_SSH_PRIVATE_KEY: ${{ secrets.WEBSITE_SSH_PRIVATE_KEY }}
          WEBSITE_SSH_HOST_KEY: ${{ vars.WEBSITE_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$WEBSITE_SSH_PRIVATE_KEY"
          test -n "$WEBSITE_SSH_HOST_KEY"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$WEBSITE_SSH_PRIVATE_KEY" > "$HOME/.ssh/release_key"
          printf '%s\n' "$WEBSITE_SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/release_key" "$HOME/.ssh/known_hosts"

      - name: Atomically deploy updater and download page
        env:
          WEBSITE_SSH_HOST: ${{ vars.WEBSITE_SSH_HOST }}
          WEBSITE_SSH_USER: ${{ vars.WEBSITE_SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$WEBSITE_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$WEBSITE_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          remote="${WEBSITE_SSH_USER}@${WEBSITE_SSH_HOST}"
          opts=(-i "$HOME/.ssh/release_key" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          remote_dir="/tmp/vmlx-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Values are validated above and intentionally expand on the client.
          # shellcheck disable=SC2029
          ssh "${opts[@]}" "$remote" "mkdir -m 700 '$remote_dir'"
          scp "${opts[@]}" website/published-latest.json .github/scripts/deploy_website_release.py panel/scripts/mlx-runtime.json "$remote:$remote_dir/"
          # shellcheck disable=SC2029
          ssh "${opts[@]}" "$remote" \
            "python3 '$remote_dir/deploy_website_release.py' --site-root /var/www/mlx.studio --updater '$remote_dir/published-latest.json' --runtime-spec '$remote_dir/mlx-runtime.json' --backup-root /var/backups/vmlx-releases"
          # shellcheck disable=SC2029
          ssh "${opts[@]}" "$remote" "rm -rf '$remote_dir'"

      - name: Purge both Cloudflare zones
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MLX_STUDIO_ZONE_ID: ${{ vars.CLOUDFLARE_MLX_STUDIO_ZONE_ID }}
          VMLX_NET_ZONE_ID: ${{ vars.CLOUDFLARE_VMLX_NET_ZONE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" && -z "$MLX_STUDIO_ZONE_ID" && -z "$VMLX_NET_ZONE_ID" ]]; then
            echo "Cloudflare purge credentials are not configured; live verification uses cache-busting URLs."
            exit 0
          fi
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$MLX_STUDIO_ZONE_ID"
          test -n "$VMLX_NET_ZONE_ID"
          purge() {
            local zone="$1"
            shift
            payload="$(python -c 'import json,sys; print(json.dumps({"files": sys.argv[1:]}))' "$@")"
            response="$(curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${zone}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "$payload")"
            python -c 'import json,sys; assert json.loads(sys.argv[1]).get("success") is True' "$response"
          }
          purge "$MLX_STUDIO_ZONE_ID" https://mlx.studio/update/latest.json https://mlx.studio/download/
          purge "$VMLX_NET_ZONE_ID" https://vmlx.net/update/latest.json https://vmlx.net/download/

      - name: Verify all public updater and download surfaces
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          user_agent="Mozilla/5.0 vMLX-Release-Verification/${GITHUB_RUN_ID}"
          for url in \
            https://raw.githubusercontent.com/jjang-ai/vmlx/main/latest.json \
            https://raw.githubusercontent.com/jjang-ai/mlxstudio/main/latest.json \
            https://mlx.studio/update/latest.json \
            https://vmlx.net/update/latest.json; do
            separator="?"
            [[ "$url" == *\?* ]] && separator="&"
            curl -A "$user_agent" -fsSL --retry 6 --retry-delay 5 \
              "${url}${separator}release=${VERSION}&run=${GITHUB_RUN_ID}" -o fetched.json
            cmp website/published-latest.json fetched.json
          done
          curl -A "$user_agent" -fsSL --retry 6 --retry-delay 5 \
            "https://mlx.studio/download/?release=${VERSION}&run=${GITHUB_RUN_ID}" -o download.html
          grep -Fq "vMLX-${VERSION}-tahoe-arm64.dmg" download.html
          grep -Fq "vMLX-${VERSION}-sequoia-arm64.dmg" download.html
          grep -Fq "\"softwareVersion\": \"${VERSION}\"" download.html
